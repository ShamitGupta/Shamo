# Run the tutor API and its TLS-terminating proxy on a single Lightsail/EC2
# instance.
#
#   cd ~/shamo && docker compose -f deploy/docker-compose.yml up -d --build
#
# Secrets come from deploy/api.env, which is created on the server by hand and
# is NOT in git. See deploy/api.env.example.

services:
  api:
    build:
      # Context is the repository root so the image can copy backend_v2/.
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ./api.env
    # Deliberately not published to the host. Only Caddy reaches the API, so
    # port 8000 is never exposed to the internet and cannot be hit directly by
    # IP -- which would otherwise bypass TLS entirely.
    expose:
      - "8000"
    # A pathological Manim render should degrade this box, not kill it. Two
    # uvicorn workers each holding a Manim import sit near 1.2GB combined at
    # rest; 3g leaves headroom for two concurrent renders on a 4GB instance
    # while still leaving the OS and Caddy alive if something runs away.
    mem_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volume, not a bind mount: it holds the issued certificate and the
      # ACME account key. Losing it means re-issuing on every restart, which
      # will hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
