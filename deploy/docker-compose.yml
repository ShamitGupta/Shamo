# The whole app on one Lightsail/EC2 instance: the tutor API, and Caddy serving
# the React build and proxying /api to it.
#
#   cd ~/Shamo && docker compose -f deploy/docker-compose.yml up -d --build
#
# Every setting comes from deploy/.env, created on the server by hand and NOT in
# git. See deploy/.env.example and deploy/LIGHTSAIL.md.

services:
  api:
    build:
      # Context is the repository root so the image can copy backend_v2/.
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ./.env
    # Deliberately not published to the host. Only Caddy reaches the API, so
    # port 8000 is never exposed to the internet and cannot be hit directly by
    # IP -- which would otherwise bypass TLS entirely.
    expose:
      - "8000"
    # A pathological Manim render should degrade this box, not kill it. Measured
    # 1 November 2026: two workers peak near 440MB during a real render, so
    # 1.5g leaves headroom on a 2GB instance while keeping the OS and Caddy
    # alive if something runs away. Raise it with the instance size.
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../frontend
      dockerfile: ../deploy/web.Dockerfile
      # Public values only -- these end up readable in the shipped JavaScript.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in deploy/.env}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?set VITE_SUPABASE_PUBLISHABLE_KEY in deploy/.env}
        VITE_DESMOS_API_KEY: ${VITE_DESMOS_API_KEY:-}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volume, not a bind mount: it holds the issued certificate and the
      # ACME account key. Losing it means re-issuing on every restart, which
      # will hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
